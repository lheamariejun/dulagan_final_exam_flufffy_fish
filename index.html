<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Fish PWA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e90ff" />
</head>
<body class="d-flex flex-column align-items-center bg-light">

  <div class="container text-center mt-4">
    <h1 class="display-4 text-primary">Flappy Fish</h1>

    <div class="game-wrapper">
      <canvas id="gameCanvas"></canvas>

      <!-- Start Overlay -->
      <div id="startOverlay" class="overlay">
        <div>
          <h2>Welcome to the Fish Game</h2>
          <button id="playButton">Play</button>
        </div>
      </div>
      
      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="gameOverOverlay">
        <div>
          <h2>Game Over</h2>
          <p id="finalScoreText"></p>
          <button id="restartButton">Restart</button>
        </div>
      </div>
      
    <p class="mt-3 text-muted">Click or tap to make the fish swim up!</p>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.error('ServiceWorker registration failed:', err));
      });
    }

    // Handle Play button
    document.getElementById('playButton').addEventListener('click', () => {
      document.getElementById('startOverlay').classList.add('hidden');
      if (typeof startGame === 'function') {
        startGame(); // Call your game start logic from app.js
      }
    });
  </script>
</body>
</html>
